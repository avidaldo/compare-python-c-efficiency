[project]
name = "compare-python-c-efficiency"
version = "0.1.0"
description = "Why Python rules AI although it is slower than C: matrix multiplication from pure Python to CUDA"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3",
    "matplotlib",
    "numba>=0.62",
    "cython>=3.1",
    "threadpoolctl",
    "torch>=2.9",
    "ipykernel",
    "nbconvert>=7.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compare_efficiency"]

[dependency-groups]
gpu = [
    "cupy-cuda13x[ctk]>=14",
]

[tool.yapf]
based_on_style = "pep8"
column_limit = 120
